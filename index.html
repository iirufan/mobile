<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#073541"><title>Koveli Staff | Login</title><link rel="stylesheet" href="css/app.css?v=15">
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-messaging-compat.js"></script>
<script src="script/firebase-config.js"></script><script src="script/pwa-config.js?v=14"></script><script src="script/user.js?v=7"></script><script src="script/app.js?v=14"></script></head><body>
<div class="loginwrap"><div class="loginbox"><img src="koveli-logo.png?v=4" class="logo" alt="Koveli Lounge"><h1>Koveli Staff Portal</h1><p class="muted">Login with an account approved and saved in <b>script/user.js</b>.</p><div id="m"></div>
<form id="f"><label>Username</label><input id="u" autocomplete="username" required><label>Password</label><input id="p" type="password" autocomplete="current-password" required>
<div class="actions"><button>Login</button><a class="btn secondary" href="register.html">Register</a></div></form></div></div>
<script>if(session())location.href="dashboard.html";f.onsubmit=async e=>{e.preventDefault();try{await login(u.value,p.value);location.href="dashboard.html"}catch(x){msg(m,x.message,"error")}}</script></body></html>
