<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#073541"><title>Koveli | Leave</title><link rel="stylesheet" href="css/app.css?v=12">
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-messaging-compat.js"></script><script src="script/firebase-config.js"></script><script src="script/pwa-config.js?v=7"></script><script src="script/user.js?v=7"></script><script src="script/app.js?v=10"></script></head><body><div id="n"></div><main class="shell"><section class="card"><h1>Leave Application</h1><div id="m"></div>
<form id="f"><div class="formgrid"><div><label>Full Name</label><input id="fullname" readonly></div><div><label>RC No.</label><input id="rcno" readonly></div><div><label>Leave Date</label><input id="leaveDate" type="date" required></div><div><label>Duty Time</label><input id="dutyTime" type="time" required></div>
<div class="full"><label>Reason</label><select id="reason" required><option value="">Select reason</option><option>Sick Leave</option><option>Family Responsibility Leave (FRL)</option><option>Emergency</option><option>Personal</option><option>Other</option></select></div>
<div class="full"><label>Document Attachment (optional, max 2.5 MB)</label><input id="attachment" type="file" accept=".pdf,.jpg,.jpeg,.png"></div></div><div class="actions"><button id="send">Send Application</button></div></form></section></main>
<script>
const s=requireLogin();if(s){n.innerHTML=nav("leave");fullname.value=s.fullname;rcno.value=s.rcno;leaveDate.min=today()}
function file64(file){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(String(r.result).split(",")[1]);r.onerror=rej;r.readAsDataURL(file)})}
f.onsubmit=async e=>{e.preventDefault();send.disabled=true;try{
 const file=attachment.files[0]; if(file&&file.size>2.5*1024*1024)throw new Error("Attachment must be 2.5 MB or smaller.");
 const doc={username:s.username,fullname:s.fullname,rcno:s.rcno,email:s.email||"",leaveDate:leaveDate.value,dutyTime:dutyTime.value,reason:reason.value,status:"pending",emailStatus:"queued",hasAttachment:!!file,attachmentName:file?.name||"",createdAt:stamp()};
 const ref=await DB().collection("leaveApplications").add(doc);
 let attachmentData=null;if(file)attachmentData={name:file.name,type:file.type||"application/octet-stream",base64:await file64(file)};
 // Email is server-side. Firestore save remains successful even if email temporarily fails.
 try{await api("/api/send-leave-email",{requestId:ref.id,...doc,attachment:attachmentData});await ref.update({emailStatus:"sent",emailSentAt:stamp()})}
 catch(mailErr){await ref.update({emailStatus:"failed",emailError:clean(mailErr.message)});}
 f.reset();fullname.value=s.fullname;rcno.value=s.rcno;leaveDate.min=today();msg(m,"Leave application saved. Email delivery is handled separately from the saved request.","ok")
}catch(x){msg(m,x.message,"error")}finally{send.disabled=false}}
</script></body></html>
