<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Koveli Lounge | Login</title>
    <link rel="stylesheet" href="styles/styles.css">
</head>
<body>
<main class="shell">
    <img class="logo" src="assets/images/koveli-logo.png" alt="Koveli Lounge">
    <section class="card">
        <h1>Welcome Back</h1>
        <p class="sub">Sign in with your approved KOVELI Lounge account</p>
        <form id="form">
            <div class="field"><label for="username">Username</label><input id="username" required autocomplete="username"></div>
            <div class="field"><label for="password">Password</label><input id="password" type="password" required autocomplete="current-password"></div>
            <button id="loginBtn" type="submit">Login <span class="spinner">…</span></button>
        </form>
        <div id="msg" class="msg"></div>
        <div class="links"><a class="btn secondary" href="system-authorization.html">Create Account</a></div>
        <p class="tiny">Login uses your approved username and password. Email is kept only for Firebase Authentication.</p>
    </section>
</main>
<script src="script/user.js"></script>
<script src="script/auth/login.js"></script>
</body>
</html>
