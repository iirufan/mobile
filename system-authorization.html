<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Koveli Lounge | System Authorization</title>
    <link rel="stylesheet" href="styles/styles.css">
</head>
<body>
    <main class="shell">
        <img class="logo" src="assets/images/koveli-logo.png" alt="Koveli Lounge">

        <section class="card">
            <h1>System Authorization</h1>
            <p class="sub">Enter the system authorization code to open user registration.</p>

            <form id="authForm">
                <div class="field">
                    <label for="authCode">Authorization Code</label>
                    <input
                        id="authCode"
                        type="password"
                        autocomplete="off"
                        placeholder="Enter system code"
                        required
                    >
                </div>

                <button id="authBtn" type="submit">
                    Authorize
                    <span class="spinner">…</span>
                </button>
            </form>

            <div id="msg" class="msg"></div>

            <div class="links">
                <a class="btn secondary" href="login.html">Back to Login</a>
            </div>
        </section>
    </main>

    <script src="script/auth/system-auth.js"></script>
</body>
</html>
