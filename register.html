<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Koveli Lounge | Registration</title>
    <link rel="stylesheet" href="styles/styles.css">
</head>
<body>
<main class="shell">
    <img class="logo" src="assets/images/koveli-logo.png" alt="Koveli Lounge">
    <section class="card">
        <h1>Create Account</h1>
        <p class="sub">Register for system access</p>
        <form id="form">
            <div class="field"><label for="name">Full Name</label><input id="name" required></div>
            <div class="field"><label for="username">Username</label><input id="username" required minlength="3" autocomplete="username"></div>
            <div class="field"><label for="email">Email</label><input id="email" type="email" required autocomplete="email"></div>
            <div class="field"><label for="password">Password</label><input id="password" type="password" minlength="6" required autocomplete="new-password"></div>
            <div class="field"><label for="confirm">Confirm Password</label><input id="confirm" type="password" minlength="6" required autocomplete="new-password"></div>
            <button id="regBtn" type="submit">Register <span class="spinner">…</span></button>
        </form>
        <div id="msg" class="msg"></div>
        <div class="links"><a class="btn secondary" href="login.html">Back to Login</a></div>
    </section>
</main>
<script>if(sessionStorage.getItem("koveliRegistrationAuthorized")!=="true") location.replace("system-authorization.html");</script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-database-compat.js"></script>
<script src="script/config/firebase-config.js"></script>
<script src="script/auth/register.js"></script>
</body>
</html>
