<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#073541"><title>Koveli | Register</title><link rel="stylesheet" href="css/app.css?v=16">
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-messaging-compat.js"></script><script src="script/firebase-config.js"></script><script src="script/pwa-config.js?v=14"></script><script src="script/user.js?v=7"></script><script src="script/app.js?v=16"></script></head><body>
<div class="loginwrap"><div class="loginbox"><img src="koveli-logo.png?v=4" class="logo" alt="Koveli Lounge"><h1>Staff Registration</h1><p class="muted">After submission, Admin must review and add the account to user.js before login.</p><div id="m"></div>
<form id="f"><div class="formgrid"><div><label>Username</label><input id="username" required></div><div><label>Full Name</label><input id="fullname" required></div><div><label>RC No.</label><input id="rcno" required></div><div><label>Email (optional)</label><input id="email" type="email"></div><div><label>Contact (optional)</label><input id="contact"></div><div><label>Password</label><input id="password" type="password" minlength="6" required></div></div>
<div class="actions"><button>Submit Registration</button><a class="btn secondary" href="index.html">Back to Login</a></div></form></div></div>
<script>f.onsubmit=async e=>{e.preventDefault();try{await register({username:username.value,fullname:fullname.value,rcno:rcno.value,email:email.value,contact:contact.value,password:password.value});f.reset();msg(m,"Registration submitted. Admin can now review it.","ok")}catch(x){msg(m,x.message,"error")}}</script></body></html>
