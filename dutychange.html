<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#073541"><title>Koveli | Duty Change</title><link rel="stylesheet" href="css/app.css?v=7">
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-messaging-compat.js"></script><script src="script/firebase-config.js"></script><script src="script/pwa-config.js?v=7"></script><script src="script/user.js?v=7"></script><script src="script/app.js?v=7"></script></head><body><div id="n"></div><main class="shell"><section class="card"><h1>Duty Change Request</h1><div id="m"></div>
<form id="f"><div class="formgrid"><div><label>Your Name</label><input id="fullname" readonly></div><div><label>RC No.</label><input id="rcno" readonly></div><div><label>Change Date</label><input id="changeDate" type="date" required></div><div><label>Your Current Duty</label><input id="currentDuty" type="time" required></div>
<div><label>Change With Staff</label><select id="withStaff" required></select></div><div><label>Requested Duty</label><input id="requestedDuty" type="time" required></div><div class="full"><label>Reason</label><textarea id="reason" required></textarea></div></div><div class="actions"><button>Submit Duty Change</button></div></form></section></main>
<script>
const s=requireLogin();if(s){n.innerHTML=nav("duty");fullname.value=s.fullname;rcno.value=s.rcno;changeDate.min=today();withStaff.innerHTML='<option value="">Select staff</option>'+getUsers().filter(x=>x.active!==false&&lower(x.username)!==lower(s.username)).map(x=>`<option value="${esc(x.username)}">${esc(x.fullname)} (${esc(x.rcno)})</option>`).join("")}
f.onsubmit=async e=>{e.preventDefault();try{const target=getUsers().find(x=>x.username===withStaff.value);await DB().collection("dutyChanges").add({username:s.username,fullname:s.fullname,rcno:s.rcno,changeDate:changeDate.value,currentDuty:currentDuty.value,withUsername:target?.username||"",withFullname:target?.fullname||"",withRCNo:target?.rcno||"",requestedDuty:requestedDuty.value,reason:reason.value,status:"pending",createdAt:stamp()});f.reset();fullname.value=s.fullname;rcno.value=s.rcno;changeDate.min=today();msg(m,"Duty change request submitted.","ok")}catch(x){msg(m,x.message,"error")}}
</script></body></html>
