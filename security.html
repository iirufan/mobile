<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#073541"><title>Koveli | Security</title><link rel="stylesheet" href="css/app.css?v=7">
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-messaging-compat.js"></script><script src="script/firebase-config.js"></script><script src="script/pwa-config.js?v=7"></script><script src="script/user.js?v=7"></script><script src="script/app.js?v=7"></script></head><body><div id="n"></div><main class="shell"><section class="card"><h1>Change Password</h1><p class="muted">The request is saved to Firebase. Admin reviews it and generates an updated user.js.</p><div id="m"></div>
<form id="f"><label>Current Password</label><input id="current" type="password" required><label>New Password</label><input id="next" type="password" minlength="6" required><label>Confirm New Password</label><input id="confirm" type="password" minlength="6" required><div class="actions"><button>Request Password Change</button></div></form></section></main>
<script>const s=requireLogin();if(s)n.innerHTML=nav("security");f.onsubmit=async e=>{e.preventDefault();try{if(next.value!==confirm.value)throw new Error("New passwords do not match.");await requestPasswordChange(current.value,next.value);f.reset();msg(m,"Password change saved for Admin review.","ok")}catch(x){msg(m,x.message,"error")}}</script></body></html>
